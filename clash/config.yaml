mixed-port: 7890

allow-lan: true

mode: rule

log-level: info


proxies: []


proxy-groups:

  - name: 🚀 Proxy
    type: select
    proxies:
      - ♻️ Auto


  - name: ♻️ Auto
    type: url-test
    proxies: []
    url: 
      https://www.gstatic.com/generate_204
    interval: 300



rules:

  - GEOIP,CN,DIRECT

  - MATCH,🚀 Proxy
